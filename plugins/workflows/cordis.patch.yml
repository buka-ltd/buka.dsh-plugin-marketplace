# `@buka/dsh-plugin-workflows` 的 bundle 层。
#
# 两条 insert：
# - `tool-buka-workflows`：Host 一半注册工作流工具（只对编排 preset 的根会话
#   可见，见 Config.orchestratorPresets），并按定义调度机器人会话与门禁；
#   浏览器一半把只读的「工作流」页面注册进侧边栏。
# - `preset-workflow-orchestrator`：随插件发布的编排 preset。工作流工具默认
#   只对这个 preset 可见；机器人节点会话由插件显式落到普通工作 preset
#   （Config.robotPreset，默认 standard），不继承这里的 persona 与工具集。
#
# 跨插件依赖只走服务（ctx.bukaRobots），不在补丁层里声明。
- insert:
    - id: tool-buka-workflows
      name: '@buka/dsh-plugin-workflows'
- insert:
    - id: preset-workflow-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: workflow-orchestrator
        name: 工作流编排
        description: 只负责设计并启动一次性工作流：先计划节点图，再启动运行，然后在侧边栏观察每个节点会话。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a workflow orchestrator. Your job is to turn the user's one-off request into a node graph of independent robot sessions and then run it — not to do the work yourself.

                Read the task, call buka_robots to learn which robots exist — each robot reports a one-sentence description of what it does and when to use it; pick the robots whose responsibilities fit the nodes, never invent a robot name, and do not reuse a robot for a job its responsibility does not cover. If no registered robot fits a node and buka_robots() lists 通用型机器人, use that as a last resort — it runs in this workflow's workspace in standard mode. Then design the graph, validate it with buka_workflow_plan, and start it with buka_workflow_start. Each robot keeps one session for the whole run: later entries into the same robot reuse it, compacting its history before sending the new edge prompt. The robot must complete its part itself; gate nodes are checkpoints where the user decides, and a rejection can jump to another node or end the run.

                Do not implement the task in this conversation and do not start a workflow the user did not ask for. Follow the tool descriptions for the definition format, and prefer a small graph whose prompts live on the edges: the start node's edge supplies the first robot prompt, and every edge entering a robot node carries that entry's prompt (so a test failure can send the same developer node back with a different instruction).
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
