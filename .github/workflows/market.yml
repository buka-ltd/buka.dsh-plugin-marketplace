name: market

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: market-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 校验索引与插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 索引钉住的是插件目录的提交，浅克隆会让 check 拿不到历史
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 必须加引号：YAML 会把裸写的 22.20 当成浮点数 22.2，
          # setup-node 于是装 22.2.0，pnpm 11 要求 >= 22.13，直接退出 1
          node-version: '22.20'
      - run: pnpm run check
        env:
          # 索引里的安装地址必须指向公司仓库，不能是 PR 的 fork
          DSH_MARKET_SOURCE_URL: https://github.com/buka-ltd/buka.dsh-plugin-marketplace
      # 单测自己造 fixture，不该读这个变量，所以这一步不设它
      - run: pnpm test
      - run: pnpm run build
        env:
          DSH_MARKET_SOURCE_URL: https://github.com/buka-ltd/buka.dsh-plugin-marketplace

  deploy:
    name: 发布索引
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 必须加引号：YAML 会把裸写的 22.20 当成浮点数 22.2，
          # setup-node 于是装 22.2.0，pnpm 11 要求 >= 22.13，直接退出 1
          node-version: '22.20'
      - run: pnpm run build
        env:
          DSH_MARKET_SOURCE_URL: https://github.com/buka-ltd/buka.dsh-plugin-marketplace
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
